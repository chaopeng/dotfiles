git:
  diffRenderers:
    - colorArg: always
      useConfig: true
      type: rawGit
gui:
  # catppuccin/themes-mergable/mocha/blue
  theme:
    activeBorderColor:
      - "#cba6f7"
      - bold
    inactiveBorderColor:
      - "#fab387"
    searchingActiveBorderColor:
      - "#94e2d5"
      - bold
    optionsTextColor:
      - "#a3b4eb"
    selectedLineBgColor:
      - "#3a3b50"
    inactiveViewSelectedLineBgColor:
      - bold
